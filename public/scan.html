<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OnFire · Escáner de puerta</title>
<meta name="theme-color" content="#050302">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Manrope:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/hellfire.css">
<style>
  #view-scan{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;overflow:hidden}
  .scan-top{flex:none;display:flex;align-items:center;justify-content:space-between;padding:11px 15px}
  .scan-top .who{font:700 14px Manrope;color:var(--cream)}
  .live{display:flex;align-items:center;gap:6px;font:600 10px Manrope;color:var(--ok)}
  .live .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .live.off{color:var(--danger)} .live.off .dot{background:var(--danger);box-shadow:none}
  #cam-wrap{position:relative;flex:1;min-height:0;background:#000;overflow:hidden;
    border-top:1px solid var(--line)}
  #cam{width:100%;height:100%;object-fit:cover;display:block}
  /* solo lo de ADENTRO del marco se escanea; lo de afuera se oscurece */
  #cam-frame{position:absolute;top:50%;left:50%;transform:translate(-50%,-56%);
    width:66%;aspect-ratio:1;border:3px solid rgba(255,150,80,.95);border-radius:22px;
    box-shadow:0 0 0 2000px rgba(0,0,0,.5);pointer-events:none}
  #cam-status{position:absolute;top:10px;left:0;right:0;text-align:center;
    font:600 12px Manrope;color:rgba(255,255,255,.85);text-shadow:0 1px 4px #000;padding:0 20px}
  /* resultado: tarjeta compacta abajo; la cámara sigue visible arriba para escanear el siguiente */
  #result{position:absolute;left:12px;right:12px;bottom:16px;border-radius:18px;padding:16px 18px;
    display:none;flex-direction:column;align-items:center;gap:8px;text-align:center;
    backdrop-filter:blur(10px);animation:pop .12s ease}
  #result.show{display:flex}
  #result.ok{background:rgba(12,40,26,.92);border:2px solid rgba(126,226,168,.7)}
  #result.bad{background:rgba(48,13,15,.92);border:2px solid rgba(232,112,106,.72)}
  #result .r-title{font:800 28px/1 Cinzel}
  #result.ok .r-title{color:var(--ok)}
  #result.bad .r-title{color:var(--danger)}
  #result .r-name{font:700 18px/1.2 Manrope;color:#fff}
  #result .r-meta{font:500 12px Manrope;color:rgba(255,255,255,.6)}
  /* barra que drena mientras el resultado sigue en pantalla: el staff ve de un
     vistazo que lo que está leyendo es reciente y cuánto le falta para limpiarse */
  #result .r-bar{position:absolute;left:0;right:0;bottom:0;height:4px;
    background:rgba(255,255,255,.10);border-radius:0 0 16px 16px;overflow:hidden}
  #result .r-bar i{display:block;height:100%;width:100%;transform-origin:left;
    animation:drenar 8s linear forwards}
  #result.ok .r-bar i{background:var(--ok)}
  #result.bad .r-bar i{background:var(--danger)}
  @keyframes drenar{from{transform:scaleX(1)}to{transform:scaleX(0)}}
  .r-type{padding:6px 18px;border-radius:10px;font:800 14px "Space Grotesk";letter-spacing:.06em}
  .r-type.vip{background:linear-gradient(150deg,#f3d27a,#d9a53a);color:#3a1e00;box-shadow:0 0 18px rgba(243,210,122,.5)}
  /* Ultra VIP con su propio color: en la barra y en la puerta no da lo mismo que un
     VIP, y con la misma insignia dorada nadie los distinguía. */
  .r-type.ultra{background:linear-gradient(150deg,#bff5ff,#38bdf8);color:#04283a;box-shadow:0 0 18px rgba(56,189,248,.5)}
  .r-type.gen{background:rgba(255,255,255,.1);color:rgba(255,255,255,.72)}
  /* lo que cambia la atención en la puerta o en la barra, debajo de la categoría */
  .r-tag{padding:4px 13px;border-radius:9px;font:800 11px "Space Grotesk";letter-spacing:.05em}
  .r-tag.cortesia{background:rgba(255,255,255,.08);color:rgba(255,255,255,.8);
    border:1px dashed rgba(255,255,255,.35)}
  .r-tag.grupo{background:rgba(255,120,40,.16);color:#ffb27a;border:1px solid rgba(255,120,40,.45)}
  .r-tag.botella{background:linear-gradient(150deg,#f3d27a,#d9a53a);color:#3a1e00}
  /* mientras el servidor contesta: ni verde ni rojo, para que nadie lo lea como un
     "pasa" adelantado */
  /* Ni verde ni rojo: ámbar. Lo usan "LEYENDO…" y "YA LO ESCANEASTE", que son los
     dos estados en los que no hay que hacer nada todavía. En la puerta el color se
     lee antes que el texto, así que un repetido en rojo hacía detener a gente que
     acababa de entrar bien. */
  /* de qué fila salió cada ingreso, chiquito bajo el nombre */
  .e-por{display:block;font:600 9.5px Manrope;color:rgba(255,255,255,.42);margin-top:2px}
  #result.wait{background:rgba(32,26,16,.94);border:2px solid rgba(243,210,122,.6)}
  #result.wait .r-title{color:#f3d27a}
  #result.wait .r-bar i{background:rgba(243,210,122,.85)}

  /* contador de entradas: chico arriba, y es el botón para ver quiénes pasaron */
  .ent-btn{display:flex;align-items:baseline;gap:5px;cursor:pointer;padding:6px 11px;
    border-radius:20px;border:1px solid rgba(255,120,40,.35);background:rgba(255,110,30,.1);
    transition:transform .1s ease,background .14s}
  .ent-btn:active{transform:scale(.94);background:rgba(255,110,30,.2)}
  .ent-btn b{font:800 14px "Space Grotesk";color:var(--ember-soft);font-variant-numeric:tabular-nums}
  .ent-btn span{font:600 10px Manrope;color:var(--cream-45)}

  #entradas{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.75);
    display:flex;align-items:flex-end}
  #entradas.hidden{display:none}
  .ent-caja{width:100%;max-height:82dvh;display:flex;flex-direction:column;
    background:linear-gradient(160deg,#1c0a04,#0d0403);border-top:1px solid var(--line-strong);
    border-radius:20px 20px 0 0;padding:16px 15px calc(16px + env(safe-area-inset-bottom));
    animation:pop .2s ease}
  .ent-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  #ent-lista{margin-top:12px;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .ent-fila{display:flex;align-items:center;gap:10px;padding:10px 2px;
    border-bottom:1px solid rgba(255,120,40,.1)}
  .ent-fila .e-n{flex:1;min-width:0;font:700 14px Manrope;color:var(--cream);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ent-fila .e-t{flex:none;font:600 11px Manrope;color:var(--cream-45)}
  .ent-fila .e-vip{flex:none;font:800 9px "Space Grotesk";letter-spacing:.1em;color:#f3d27a}
</style>
</head>
<body>
<div class="glow-orb"></div>

<!-- Candado de la puerta: si no hay permiso (ni sesión de admin ni clave del día),
     la cámara ni se enciende. -->
<div id="view-gate" class="wrap hidden">
  <div style="margin-top:11dvh;text-align:center">
    <div class="kicker">CONTROL DE ACCESO</div>
    <div class="brand" id="gate-evento" style="margin-top:8px">HELLFIRE</div>
    <div class="sub" style="margin-top:14px">Escáner de la puerta</div>
  </div>

  <div style="margin-top:auto">
    <div class="hint" style="text-align:center;margin-bottom:16px;font-size:12px;color:var(--cream-60)">
      Escribe la clave que te dio el organizador</div>
    <!-- Seis casillas en vez de un campo de texto: se ve cuántos dígitos faltan sin
         contarlos, y es el mismo gesto que ya conocen del panel de vendedor. -->
    <div class="pinrow gate6" id="gate-row">
      <div class="pinbox">•</div><div class="pinbox">•</div><div class="pinbox">•</div>
      <div class="pinbox">•</div><div class="pinbox">•</div><div class="pinbox">•</div>
    </div>
    <input id="gate-code" type="tel" inputmode="numeric" maxlength="6" autocomplete="one-time-code"
           style="position:absolute;opacity:0;pointer-events:none" aria-label="Clave de 6 dígitos">
    <div class="err mt12" id="gate-err" style="text-align:center"></div>
    <button class="btn" id="btn-gate">ENTRAR&nbsp;&nbsp;⟶</button>
    <div class="muted" style="text-align:center;margin-top:16px;font-size:10px;color:rgba(246,241,231,.3)">
      Sin la clave no se puede validar ningún boleto</div>
  </div>
</div>

<div id="view-scan">
  <div class="scan-top">
    <div class="row" style="gap:10px">
      <a href="/admin" class="iconbtn" id="btn-scan-back" title="Volver al panel" style="text-decoration:none;display:flex;align-items:center;justify-content:center">‹</a>
      <div class="avatar">▣</div><div class="who">Puerta</div>
    </div>
    <div class="row" style="gap:9px">
      <button class="ent-btn" id="btn-ent"><b id="ent-num">0</b><span>entradas</span></button>
      <div class="live" id="live"><span class="dot"></span><span id="live-text">En vivo</span></div>
    </div>
  </div>
  <div id="cam-wrap">
    <video id="cam" muted playsinline></video>
    <div id="cam-frame"></div>
    <div id="cam-status">Apunta la cámara al código QR</div>
    <div id="result"></div>
  </div>

  <!-- Quiénes ya entraron. Se abre desde el contador de arriba y se cierra tocando
       fuera: en la puerta no hay tiempo de buscar una "x". -->
  <div id="entradas" class="hidden">
    <div class="ent-caja">
      <div class="ent-top">
        <div>
          <div class="label" style="margin:0">Ya entraron</div>
          <div class="muted" id="ent-sub" style="font-size:11px;margin-top:3px"></div>
        </div>
        <button class="volver" id="ent-cerrar">Cerrar</button>
      </div>
      <div class="search mt12">
        <span class="ico">⌕</span>
        <input id="ent-q" placeholder="Buscar por nombre…" autocomplete="off">
      </div>
      <div id="ent-lista"></div>
    </div>
  </div>
</div>

<script src="/js/jsQR.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/scan.js"></script>
</body>
</html>
